name: Build and deploy Node.js app to Azure Web App - roadverdict
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # Started at job start, in parallel with checkout/setup/typecheck/lint/
    # unit-tests below - by the time the "Wait for Cosmos DB Emulator" step
    # runs, most of its startup time has likely already elapsed in the
    # background, rather than being pure added latency.
    services:
      cosmosdb-emulator:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
        ports:
          - 8081:8081
          - 10250:10250
          - 10251:10251
          - 10252:10252
          - 10253:10253
          - 10254:10254
        env:
          AZURE_COSMOS_EMULATOR_PARTITION_COUNT: '3'
          AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Component tests
        run: npm run test:components
      - name: Wait for Cosmos DB Emulator
        run: |
          for i in $(seq 1 60); do
            if curl -sk --fail https://localhost:8081/_explorer/emulator.pem -o /dev/null; then
              echo "Cosmos DB Emulator is ready."
              exit 0
            fi
            sleep 5
          done
          echo "Cosmos DB Emulator did not become ready in time." >&2
          exit 1
      - name: Integration tests (Cosmos DB Emulator)
        run: npm run test:integration
      - name: Build (proves the app actually compiles before anything downstream bothers)
        run: npm run build

  authenticated-e2e:
    needs: test
    runs-on: ubuntu-latest
    # A deliberately SEPARATE, fresh emulator container from the `test`
    # job's - that one has already absorbed a full integration-test
    # suite's worth of writes by the time it finishes, and this job's
    # demo-account reset does another real, ~150-document sequential
    # write burst on top (see runDemoSeed's own comment on why it's
    # sequential). Sharing one container across both was exactly what
    # caused a real, reproducible hang in practice - this isolates the
    # heavy write burst onto its own container instead of layering it on
    # top of an already-worn one.
    services:
      cosmosdb-emulator:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
        ports:
          - 8081:8081
          - 10250:10250
          - 10251:10251
          - 10252:10252
          - 10253:10253
          - 10254:10254
        env:
          AZURE_COSMOS_EMULATOR_PARTITION_COUNT: '3'
          AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Wait for Cosmos DB Emulator
        run: |
          for i in $(seq 1 60); do
            if curl -sk --fail https://localhost:8081/_explorer/emulator.pem -o /dev/null; then
              echo "Cosmos DB Emulator is ready."
              exit 0
            fi
            sleep 5
          done
          echo "Cosmos DB Emulator did not become ready in time." >&2
          exit 1
      # Runs against the just-built app, served locally on this runner
      # and backed by this job's own Cosmos emulator - never against
      # production. This is what makes it safe to gate the deploy on: a
      # real browser driving the real demo account (see
      # tests/e2e/helpers/demoAuth.ts) through real forms and a real
      # backend, without ever touching live user data. If this fails,
      # neither the deploy job nor its Azure credentials ever run.
      - name: Start app server (Cosmos DB Emulator backend)
        # Calls `next start` directly rather than through the `npm run
        # start` script (which resolves its port via `$PORT` in the
        # script string itself) - avoids depending on npm's own
        # script-shell behavior for something this step already controls
        # explicitly.
        run: |
          APP_URL=http://localhost:3000 NODE_TLS_REJECT_UNAUTHORIZED=0 \
          COSMOS_CONNECTION_STRING="AccountEndpoint=https://localhost:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;" \
          nohup npx next start -p 3000 > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for app server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login -o /dev/null; then
              echo "App server is ready."
              exit 0
            fi
            sleep 2
          done
          echo "App server did not become ready in time." >&2
          cat server.log
          exit 1
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Authenticated E2E tests (demo account, local server + Cosmos emulator)
        run: npx playwright test tests/e2e/authenticated-demo-journey.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - name: Print app server log (only on failure - the server's own stdout/stderr for whatever the test above hit)
        if: failure()
        run: cat server.log || true
      - name: Stop app server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  deploy:
    needs: [test, authenticated-e2e]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_58CD24E8269D4F86A21D229F1D16C1BC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AC1E6A88B8D4BD083D4EF5FB1C56E5B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9AEFEAE0070247B48082559465350A6A }}
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'roadverdict'
          slot-name: 'Production'
          package: .
      - name: Wait for the deployed instance to finish restarting
        run: sleep 20
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Post-deploy smoke test
        # Public/unauthenticated only, against the real live site - a
        # failure here means the deploy already happened, it's reporting
        # the live site looks broken, not blocking anything (see the
        # original commit that added this step). The authenticated demo
        # journeys are a pre-deploy gate in the authenticated-e2e job
        # instead, against an emulator, on purpose - never against real
        # production data.
        run: npx playwright test tests/e2e/public-smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: https://roadverdict.co.uk
