name: Build and deploy Node.js app to Azure Web App - roadverdict
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Component tests
        run: npm run test:components
      # Against a real, dedicated test-only Azure Cosmos DB account, not
      # the Linux Docker emulator this used to run against - that image
      # has a real, unresolved upstream crash bug (a "Last Chance"/
      # SIGHUP fatal fault under write load) that repeatedly took this
      # whole job down on GitHub Actions runners. A real Cosmos DB
      # account doesn't have that bug, and needs no container to start,
      # wait for, or restart. tests/integration/globalSetup.ts prefers
      # this connection string over the local emulator whenever it's
      # set, so nothing changes for local development.
      - name: Integration tests (real Cosmos DB test account)
        run: npm run test:integration
        env:
          COSMOS_TEST_CONNECTION_STRING: ${{ secrets.COSMOS_TEST_CONNECTION_STRING }}
      - name: Build (proves the app actually compiles before anything downstream bothers)
        run: npm run build

  authenticated-e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Against the same real, dedicated test-only Azure Cosmos DB
      # account the `test` job's integration suite uses above - not the
      # Linux Docker emulator, which had a real, unresolved upstream
      # crash bug that repeatedly took this exact job down (see this
      # file's git history for the docker-run/restart/retry machinery
      # this replaced). roadverdict/app is created here if missing, same
      # shape (partition key /pk) production uses - idempotent, so safe
      # to run on every push.
      - name: Provision the roadverdict/app database+container on the real test Cosmos account
        run: |
          node -e "
          const { CosmosClient } = require('@azure/cosmos');
          const client = new CosmosClient(process.env.COSMOS_CONNECTION_STRING);
          (async () => {
            const { database } = await client.databases.createIfNotExists({ id: 'roadverdict' });
            await database.containers.createIfNotExists({ id: 'app', partitionKey: { paths: ['/pk'] } });
          })().catch((err) => { console.error(err); process.exit(1); });
          "
        env:
          COSMOS_CONNECTION_STRING: ${{ secrets.COSMOS_TEST_CONNECTION_STRING }}
      # Backgrounded and detached (nohup + &) so it survives past this
      # step's own shell into the "Authenticated E2E tests" step below -
      # a real Cosmos account needs no readiness wait of its own (unlike
      # the emulator, it's always already up), so the only thing this
      # loop is actually waiting on is Next.js itself starting.
      - name: Start the app server
        run: |
          nohup npx next start -p 3000 > server.log 2>&1 &
          echo $! > server.pid

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login -o /dev/null; then
              echo "App server ready."
              exit 0
            fi
            sleep 2
          done
          echo "App server did not become ready in time." >&2
          cat server.log
          exit 1
        env:
          APP_URL: http://localhost:3000
          COSMOS_CONNECTION_STRING: ${{ secrets.COSMOS_TEST_CONNECTION_STRING }}
      - name: Authenticated E2E tests
        run: npx playwright test tests/e2e/authenticated-demo-journey.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      # Playwright already writes trace.zip/error-context.md/the failure
      # screenshot under test-results/ on failure (trace:
      # "retain-on-failure", screenshot: "only-on-failure" in
      # playwright.config.ts) - without this step they only ever exist on
      # the runner's disk and are gone the moment the job ends, which is
      # why a failure log names a file path with nothing to actually
      # download. if: failure() only, so a normal green run uploads
      # nothing.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14
      - name: Stop the app server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

  deploy:
    needs: [test, authenticated-e2e]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_58CD24E8269D4F86A21D229F1D16C1BC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AC1E6A88B8D4BD083D4EF5FB1C56E5B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9AEFEAE0070247B48082559465350A6A }}
      # The Build step above already produced a fully installed
      # node_modules and a built .next directory - without this, Azure's
      # Oryx build system runs npm install/build AGAIN on the uploaded
      # package (package: . below includes both already), which is most
      # of why "Package deployment using OneDeploy" can sit for 5-15
      # minutes doing fully redundant work. Resource group is looked up
      # dynamically rather than hardcoded, since nothing in this file
      # needed one before now.
      #
      # Only WRITES the setting (and only then waits) when it isn't
      # already correct - changing an App Service setting restarts its
      # SCM/Kudu container, and starting a deploy while that restart is
      # still in flight fails outright ("Deployment has been stopped due
      # to SCM container restart... do not perform a management
      # operation and a deployment operation in quick succession" - the
      # exact failure this caused the first time this step ran). Once
      # it's set correctly, every later deploy skips the write entirely,
      # so there's no restart and no wait needed on the common path.
      - name: Skip Azure's redundant server-side rebuild on deploy
        run: |
          RESOURCE_GROUP=$(az webapp list --query "[?name=='roadverdict'].resourceGroup" -o tsv)
          CURRENT=$(az webapp config appsettings list \
            --name roadverdict \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT'].value" -o tsv)
          if [ "$CURRENT" != "false" ]; then
            az webapp config appsettings set \
              --name roadverdict \
              --resource-group "$RESOURCE_GROUP" \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false
            echo "Setting changed - waiting for the SCM container restart it triggers to settle before deploying."
            sleep 45
          fi
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'roadverdict'
          slot-name: 'Production'
          package: .
      - name: Wait for the deployed instance to finish restarting
        # A fixed sleep 20 sat here before - long enough for a routine
        # deploy's restart, not long enough for a slower one (e.g. a
        # bigger bundle from a Next.js major-version upgrade), which is
        # exactly what caused the post-deploy smoke test below to
        # false-alarm once. Polls instead, same pattern as the
        # authenticated-e2e job's own "Start the app server" step -
        # returns as soon as the site responds, so a normal deploy isn't
        # slowed down, but a slow one gets up to 90s instead of 20.
        run: |
          for i in $(seq 1 30); do
            if curl -sf https://roadverdict.co.uk/ -o /dev/null; then
              echo "Live site is responding."
              exit 0
            fi
            sleep 3
          done
          echo "Live site did not respond within the wait window - proceeding anyway; the smoke test below will report the real state." >&2
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Post-deploy smoke test
        # Public/unauthenticated only, against the real live site - a
        # failure here means the deploy already happened, it's reporting
        # the live site looks broken, not blocking anything (see the
        # original commit that added this step). The authenticated demo
        # journeys are a pre-deploy gate in the authenticated-e2e job
        # instead, against a dedicated test-only Cosmos DB account, on
        # purpose - never against real production data.
        run: npx playwright test tests/e2e/public-smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: https://roadverdict.co.uk
