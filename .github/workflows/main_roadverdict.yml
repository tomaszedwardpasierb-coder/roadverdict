name: Build and deploy Node.js app to Azure Web App - roadverdict
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # Started at job start, in parallel with checkout/setup/typecheck/lint/
    # unit-tests below - by the time the "Wait for Cosmos DB Emulator" step
    # runs, most of its startup time has likely already elapsed in the
    # background, rather than being pure added latency.
    services:
      cosmosdb-emulator:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
        ports:
          - 8081:8081
          - 10250:10250
          - 10251:10251
          - 10252:10252
          - 10253:10253
          - 10254:10254
        env:
          AZURE_COSMOS_EMULATOR_PARTITION_COUNT: '3'
          AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Component tests
        run: npm run test:components
      - name: Wait for Cosmos DB Emulator
        run: |
          for i in $(seq 1 60); do
            if curl -sk --fail https://localhost:8081/_explorer/emulator.pem -o /dev/null; then
              echo "Cosmos DB Emulator is ready."
              exit 0
            fi
            sleep 5
          done
          echo "Cosmos DB Emulator did not become ready in time." >&2
          exit 1
      - name: Integration tests (Cosmos DB Emulator)
        run: npm run test:integration
      - name: Build (proves the app actually compiles before anything downstream bothers)
        run: npm run build

  authenticated-e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # The Cosmos DB Emulator's Linux/Docker image is documented,
      # unresolved-upstream flaky software - it has a real, known crash
      # bug (a "Last Chance" fatal error deep in sqlpal.dll, its Windows-
      # on-Linux compatibility layer) reported against GitHub Actions
      # runners specifically: see
      # https://github.com/Azure/azure-cosmos-db-emulator-docker/issues/142
      # and #56 ("success occurring about once every three to four
      # attempts"). That's not something fixable from this side - the
      # emulator is run manually via `docker run` here (not the
      # declarative `services:` block used in the `test` job) precisely
      # so a crash can be detected and retried with a genuinely fresh
      # container, rather than the whole job just failing outright on
      # what upstream itself describes as expected, intermittent
      # behavior. A real app-level bug would fail identically on every
      # attempt; this crash, per those reports, usually doesn't.
      - name: Authenticated E2E tests, with retry for the Cosmos DB Emulator's known Docker/CI flakiness
        run: |
          set +e
          MAX_ATTEMPTS=3
          SUCCESS=0
          CONNECTION_STRING="AccountEndpoint=https://localhost:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;"

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "::group::Attempt $attempt/$MAX_ATTEMPTS"
            docker rm -f cosmosdb-emulator >/dev/null 2>&1

            docker run -d --name cosmosdb-emulator \
              -p 8081:8081 -p 10250:10250 -p 10251:10251 -p 10252:10252 -p 10253:10253 -p 10254:10254 \
              -e AZURE_COSMOS_EMULATOR_PARTITION_COUNT=1 \
              -e AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=false \
              mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest

            READY=0
            for i in $(seq 1 60); do
              if curl -sk --fail https://localhost:8081/_explorer/emulator.pem -o /dev/null; then
                READY=1
                break
              fi
              sleep 5
            done
            if [ "$READY" != "1" ]; then
              echo "Emulator did not become ready on attempt $attempt."
              docker logs cosmosdb-emulator 2>&1 | tail -60
              docker rm -f cosmosdb-emulator >/dev/null 2>&1
              echo "::endgroup::"
              continue
            fi

            NODE_TLS_REJECT_UNAUTHORIZED=0 node -e "
            const { CosmosClient } = require('@azure/cosmos');
            const client = new CosmosClient('$CONNECTION_STRING');
            (async () => {
              const { database } = await client.databases.createIfNotExists({ id: 'roadverdict' });
              await database.containers.createIfNotExists({ id: 'app', partitionKey: { paths: ['/pk'] } });
            })().catch((err) => { console.error(err); process.exit(1); });
            "
            if [ $? -ne 0 ]; then
              echo "Provisioning the emulator's database/container failed on attempt $attempt."
              docker rm -f cosmosdb-emulator >/dev/null 2>&1
              echo "::endgroup::"
              continue
            fi

            APP_URL=http://localhost:3000 NODE_TLS_REJECT_UNAUTHORIZED=0 COSMOS_CONNECTION_STRING="$CONNECTION_STRING" \
              nohup npx next start -p 3000 > server.log 2>&1 &
            SERVER_PID=$!

            APP_READY=0
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/login -o /dev/null; then
                APP_READY=1
                break
              fi
              sleep 2
            done
            if [ "$APP_READY" != "1" ]; then
              echo "App server did not become ready on attempt $attempt."
              cat server.log
              kill "$SERVER_PID" 2>/dev/null
              docker rm -f cosmosdb-emulator >/dev/null 2>&1
              echo "::endgroup::"
              continue
            fi

            PLAYWRIGHT_BASE_URL=http://localhost:3000 npx playwright test tests/e2e/authenticated-demo-journey.spec.ts
            TEST_EXIT=$?

            if [ "$TEST_EXIT" -eq 0 ]; then
              SUCCESS=1
              kill "$SERVER_PID" 2>/dev/null
              docker rm -f cosmosdb-emulator >/dev/null 2>&1
              echo "::endgroup::"
              break
            fi

            echo "Authenticated E2E failed on attempt $attempt - app server log:"
            cat server.log
            echo "Cosmos emulator container log (tail):"
            docker logs cosmosdb-emulator 2>&1 | tail -80
            kill "$SERVER_PID" 2>/dev/null
            docker rm -f cosmosdb-emulator >/dev/null 2>&1
            echo "::endgroup::"
          done

          if [ "$SUCCESS" != "1" ]; then
            echo "Authenticated E2E did not succeed after $MAX_ATTEMPTS attempts."
            exit 1
          fi
          echo "Authenticated E2E succeeded."

  deploy:
    needs: [test, authenticated-e2e]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_58CD24E8269D4F86A21D229F1D16C1BC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AC1E6A88B8D4BD083D4EF5FB1C56E5B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9AEFEAE0070247B48082559465350A6A }}
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'roadverdict'
          slot-name: 'Production'
          package: .
      - name: Wait for the deployed instance to finish restarting
        run: sleep 20
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Post-deploy smoke test
        # Public/unauthenticated only, against the real live site - a
        # failure here means the deploy already happened, it's reporting
        # the live site looks broken, not blocking anything (see the
        # original commit that added this step). The authenticated demo
        # journeys are a pre-deploy gate in the authenticated-e2e job
        # instead, against an emulator, on purpose - never against real
        # production data.
        run: npx playwright test tests/e2e/public-smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: https://roadverdict.co.uk
